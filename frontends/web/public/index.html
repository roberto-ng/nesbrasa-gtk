<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nesbrasa</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <h1>Nesbrasa</h1>
        <label class="file-button">
          Open ROM
          <input id="rom" type="file" accept=".nes">
        </label>
        <button id="pause" type="button" disabled>Pause</button>
        <output id="status">No ROM loaded</output>
      </header>
      <section class="screen-wrap" aria-label="NES screen">
        <canvas id="screen" width="256" height="240"></canvas>
      </section>
      <p class="help">Keyboard: Z / X, Enter, Backspace, and the arrow keys.</p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
